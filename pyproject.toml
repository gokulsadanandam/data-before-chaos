[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenrecord"
version = "0.1.0"
description = "Data before Chaos: GenAI customer data harmonization and quality guardrails on Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - EPAM Accelerate Next hackathon entry" }
authors = [{ name = "Team Data before Chaos" }]
# Runtime dependencies are deliberately minimal: Fabric Spark runtimes already ship
# PySpark, pandas, pyarrow and PyYAML. Pinning them here would fight the runtime.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<5",
    "pandas>=2.0",
    "pyarrow>=14",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "nbformat>=5.9",
    "pre-commit>=3.7",
]

[project.scripts]
goldenrecord-local = "goldenrecord.local_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goldenrecord = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # naming
    "PL",            # pylint subset
    "RUF",           # ruff-specific
    "S",             # bandit security
]
ignore = [
    "PLR0913",  # Spark helpers legitimately take many arguments
    "PLR2004",  # magic numbers are config-driven and named at call sites
    "S101",     # asserts are used in tests
    "PLR0915",
    "PLR0917",  # same reason as PLR0913 (positional Spark helper arguments)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "PLC0415"]
"tools/**" = ["S311"]  # synthetic data generator uses non-crypto randomness on purpose
"fabric/user_data_functions/**" = ["N803", "N802"]  # Fabric requires camelCase parameters

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["goldenrecord"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "notebookutils.*", "mlflow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: tests that start a local Spark session (slower)",
    "e2e: end-to-end pipeline tests on synthetic data",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["goldenrecord"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
